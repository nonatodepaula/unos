{% extends 'rateio/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white fw-bold">Criar Novo Evento de Alimentação</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        {{ form.titulo.label_tag }}
                        {{ form.titulo }}
                    </div>
                    <div class="mb-3">
                        {{ form.descricao.label_tag }}
                        {{ form.descricao }}
                    </div>
                    <button type="submit" class="btn btn-success">Criar Evento</button>
                    <a href="{% url 'lista_eventos' %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
