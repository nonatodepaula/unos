{% extends 'rateio/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white fw-bold">
                Confirmar Exclusão de Participante
            </div>
            <div class="card-body">
                <p>Tem certeza que deseja remover <strong>{{ participante.usuario.username }}</strong> do evento <strong>{{ evento.titulo }}</strong>?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Sim, Remover</button>
                    <a href="{% url 'detalhe_evento' evento.pk %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
