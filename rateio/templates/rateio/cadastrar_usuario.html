{% extends 'rateio/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-warning shadow-sm">
            <div class="card-header bg-warning text-dark fw-bold">Painel do Superuser: Cadastrar Novo Usuário</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Cadastrar Usuário</button>
                    <a href="{% url 'lista_eventos' %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
